<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking des mains</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            transform: scaleX(-1);
            mix-blend-mode: difference;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 4px;
            z-index: 10;
            display: none;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="status"></div>

    <script type="module">
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.min.mjs';

        const video = document.getElementById('camera');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let handLandmarker = null;
        let running = false;

        function status(msg) {
            statusEl.style.display = 'block';
            statusEl.textContent = msg;
            console.log(msg);
        }

        const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

        async function init() {
            const fileset = await FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
            );
            try {
                status('Chargement du modèle IA…');
                handLandmarker = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: MODEL,
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 2,
                    minHandDetectionConfidence: 0.3,
                    minHandPresenceConfidence: 0.3,
                    minTrackingConfidence: 0.3
                });
            } catch (e) {
                status('GPU indisponible, bascule CPU…');
                handLandmarker = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: MODEL,
                        delegate: 'CPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 2,
                    minHandDetectionConfidence: 0.3,
                    minHandPresenceConfidence: 0.3,
                    minTrackingConfidence: 0.3
                });
            }
            status('Modèle chargé. Montre tes mains devant la caméra.');
            setTimeout(() => statusEl.style.display = 'none', 3000);
        }

        function drawCornerRect(pts) {
            const path = () => {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
            };
            const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
            const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
            const maxR = Math.max(...pts.map(p => Math.hypot(p.x - cx, p.y - cy)));
            const t = performance.now() / 1000;
            const pulse = 0.75 + 0.25 * Math.sin(t * 2);

            const g = ctx.createRadialGradient(cx, cy, maxR * 0.1, cx, cy, maxR);
            g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            g.addColorStop(0.6, 'rgba(255, 255, 255, 0.7)');
            g.addColorStop(1, 'rgba(255, 255, 255, 0)');
            path();
            ctx.fillStyle = g;
            ctx.fill();

            if (ctx.filter !== undefined) {
                ctx.save();
                ctx.filter = 'blur(12px)';
                path();
                ctx.strokeStyle = 'rgba(180, 130, 255, ' + (0.5 * pulse).toFixed(2) + ')';
                ctx.lineWidth = 10;
                ctx.stroke();
                ctx.restore();
            }

            path();
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.55 * pulse).toFixed(2) + ')';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        let lastResults = null;
        let lastDetectTime = 0;
        let smoothedRect = null;
        let rectVisible = false;
        let noHandsCount = 0;

        const CLOSE_R = 0.5;
        const OPEN_R = 0.8;

        function pinchRatio(hand) {
            const lm = hand.landmarks;
            const pinch = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
            const palm = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);
            return pinch / palm;
        }

        function detect() {
            if (!running || !handLandmarker) return;
            const now = performance.now();
            if (now - lastDetectTime >= 16) {
                lastDetectTime = now;
                let results;
                try {
                    results = handLandmarker.detectForVideo(video, now);
                } catch (e) {
                    requestAnimationFrame(detect);
                    return;
                }
                lastResults = results;

                const handsInfo = [];
                if (results.landmarks) {
                    for (let i = 0; i < results.landmarks.length; i++) {
                        const landmarks = results.landmarks[i];
                        handsInfo.push({
                            thumb: { x: landmarks[4].x * canvas.width, y: landmarks[4].y * canvas.height },
                            index: { x: landmarks[8].x * canvas.width, y: landmarks[8].y * canvas.height },
                            landmarks
                        });
                    }
                }

                if (handsInfo.length === 2) {
                    noHandsCount = 0;
                    const a = handsInfo[0];
                    const b = handsInfo[1];
                    const aC = (a.thumb.x + a.index.x) / 2;
                    const bC = (b.thumb.x + b.index.x) / 2;
                    const left = aC <= bC ? a : b;
                    const right = aC <= bC ? b : a;
                    const newPts = [left.index, left.thumb, right.thumb, right.index];
                    if (!smoothedRect) {
                        smoothedRect = newPts.map(p => ({ x: p.x, y: p.y }));
                    } else {
                        const f = 0.7;
                        smoothedRect = smoothedRect.map((sm, i) => ({
                            x: sm.x + (newPts[i].x - sm.x) * f,
                            y: sm.y + (newPts[i].y - sm.y) * f
                        }));
                    }

                    const pinch = (pinchRatio(a) + pinchRatio(b)) / 2;
                    if (pinch < CLOSE_R) rectVisible = false;
                    else if (pinch > OPEN_R) rectVisible = true;
                    statusEl.style.display = 'block';
                    statusEl.textContent = 'Mains: 2 · pinch ' + pinch.toFixed(2) + ' · ' + (rectVisible ? '1' : '0');
                } else if (smoothedRect) {
                    noHandsCount++;
                    if (noHandsCount > 15) {
                        const cx = smoothedRect.reduce((s, p) => s + p.x, 0) / 4;
                        const cy = smoothedRect.reduce((s, p) => s + p.y, 0) / 4;
                        smoothedRect = smoothedRect.map(p => ({
                            x: cx + (p.x - cx) * 0.7,
                            y: cy + (p.y - cy) * 0.7
                        }));
                        const size = smoothedRect.reduce((s, p) => s + Math.hypot(p.x - cx, p.y - cy), 0);
                        if (size < 4) {
                            smoothedRect = null;
                            rectVisible = false;
                        }
                    }
                }
            }

            const results = lastResults;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results && results.landmarks) {
                if (results.landmarks.length !== 2) {
                    statusEl.style.display = 'block';
                    statusEl.textContent = 'Mains détectées : ' + results.landmarks.length;
                }
            }

            if (smoothedRect && rectVisible) {
                drawCornerRect(smoothedRect);
            }
            requestAnimationFrame(detect);
        }

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                await init();
                running = true;
                detect();
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch (err) {
                status('Erreur : ' + err.message);
            }
        }

        start();
    </script>
</body>
</html>
